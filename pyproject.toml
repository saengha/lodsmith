[project]
name = "lodsmith"
version = "0.1.0"
description = "Local low-poly prop recipes for Blender"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lodsmith = "addon.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
